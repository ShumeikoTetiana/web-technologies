<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №9 - Форми</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab(event, 'signup')">Signup</button>
        <button class="tab-btn" onclick="openTab(event, 'login')">Login</button>
    </div>

    <form id="signup" class="tab-content active-content">
        <h2>Create an account</h2>
        <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" placeholder="Enter first name">
            <span class="error-msg"></span>
        </div>
        <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastName" placeholder="Enter last name">
            <span class="error-msg"></span>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="Enter email">
            <span class="error-msg"></span>
        </div>
        <div class="form-group password-field">
            <label>Password</label>
            <input type="password" id="regPassword" placeholder="Enter password">
            <img src="eye.png" class="toggle-password" alt="Show password">
            <span class="error-msg"></span>
        </div>
        <div class="form-group password-field">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password">
            <img src="eye.png" class="toggle-password" alt="Show password">
            <span class="error-msg"></span>
        </div>
        <div class="form-group">
            <label>Phone (+380...)</label>
            <input type="text" id="phone" placeholder="+380XXXXXXXXX">
            <span class="error-msg"></span>
        </div>
        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" id="dob">
            <span class="error-msg"></span>
        </div>
        <div class="form-group">
            <label>Sex</label>
            <div class="radio-group">
                <input type="radio" name="sex" value="male" id="male"> <label for="male">Male</label>
                <input type="radio" name="sex" value="female" id="female"> <label for="female">Female</label>
            </div>
            <span class="error-msg"></span>
        </div>
        <div class="form-group">
            <label>Country</label>
            <select id="country">
                <option value="">Choose country...</option>
                <option value="Ukraine">Ukraine</option>
                <option value="USA">USA</option>
            </select>
            <span class="error-msg"></span>
        </div>
        <div class="form-group">
            <label>City</label>
            <select id="city" disabled>
                <option value="">Choose city...</option>
            </select>
            <span class="error-msg"></span>
        </div>
        <button type="submit" class="submit-btn">Signup</button>
    </form>

    <form id="login" class="tab-content">
        <h2>Login here</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="loginUser" placeholder="Enter username">
            <span class="error-msg"></span>
        </div>
        <div class="form-group password-field">
            <label>Password</label>
            <input type="password" id="loginPass" placeholder="Enter password">
            <img src="eye.png" class="toggle-password" alt="Show password">
            <span class="error-msg"></span>
        </div>
        <div class="form-group checkbox-group">
            <input type="checkbox" id="rememberMe">
            <label for="rememberMe">Remember Me</label>
        </div>
        <button type="submit" class="submit-btn">Login</button>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
