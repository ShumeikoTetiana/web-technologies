<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
<div class="todo-container">
    <header class="todo-header">
        <h2>Мої завдання</h2>
        <div class="sort-chips">
            <button onclick="setTodoSort('createdAt')">Час</button>
            <button onclick="setTodoSort('done')">Статус</button>
        </div>
    </header>

    <div class="input-row">
        <input type="text" id="todo-input" placeholder="Що потрібно зробити?" required>
        <button class="add-btn" onclick="addNewTodo()">+</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>
</div>
<script src="script2.js"></script>
</body>
</html>
